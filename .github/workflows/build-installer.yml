name: Build Installer

on:
  push:
    tags:
      - 'installer-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: "installer/release/*.dmg"
          - os: windows-latest
            platform: win
            artifact: "installer/release/*.exe"
          - os: ubuntu-latest
            platform: linux
            artifact: "installer/release/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MCP server bundle
        run: npm install && npm run bundle

      - name: Copy bundle to installer resources
        shell: bash
        run: |
          mkdir -p installer/resources/mcp
          cp dist/bundle.mjs installer/resources/mcp/bundle.mjs

      - name: Install installer dependencies
        working-directory: installer
        run: npm install

      - name: Build installer (${{ matrix.platform }})
        working-directory: installer
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## yeorot MCP 설치 프로그램

            아래에서 운영체제에 맞는 파일을 다운로드하세요.

            | OS | 파일 |
            |---|---|
            | macOS | `.dmg` |
            | Windows | `.exe` |
            | Linux | `.AppImage` |

            ### 설치 방법
            1. 파일 다운로드 후 실행
            2. API 키 입력
            3. 설치하기 클릭
            4. Claude Desktop 재시작
