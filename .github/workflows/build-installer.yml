name: Build Installer

on:
  push:
    tags:
      - 'installer-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: "installer/release/*.dmg"
          - os: windows-latest
            platform: win
            artifact: "installer/release/*.exe"
          - os: ubuntu-latest
            platform: linux
            artifact: "installer/release/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MCP server bundle
        run: npm install && npm run bundle

      - name: Copy bundle to installer resources
        shell: bash
        run: |
          mkdir -p installer/resources
          cp dist/bundle.mjs installer/resources/bundle.mjs

      # ──────────────────────────────────────────────────────────────
      # macOS: Apple Developer 인증서 import (Secrets 있을 때만 실행)
      # BUILD_CERTIFICATE_BASE64 Secret이 없으면 서명 없이 빌드
      # ──────────────────────────────────────────────────────────────
      - name: Import Apple Developer certificate (macOS only)
        if: matrix.platform == 'mac' && env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # base64 → .p12 복원
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # 임시 Keychain 생성
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 인증서 import
          security import $CERTIFICATE_PATH \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH

          # codesign이 암호 없이 접근할 수 있도록 파티션 리스트 설정
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH

          # 검색 Keychain에 추가
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install installer dependencies
        working-directory: installer
        run: npm install

      # CSC_LINK을 빈 문자열로 설정하면 electron-builder가 cwd를 인증서 경로로 해석해 오류 발생.
      # Secret이 있을 때만 GITHUB_ENV에 추가해 env에 아예 존재하지 않게 처리.
      - name: Set CSC_LINK (only when cert secret exists)
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: echo "CSC_LINK=$RUNNER_TEMP/build_certificate.p12" >> $GITHUB_ENV

      - name: Build installer (${{ matrix.platform }})
        working-directory: installer
        run: npm run build:${{ matrix.platform }}
        env:
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────
      # macOS: 임시 Keychain 정리 (항상 실행)
      # ──────────────────────────────────────────────────────────────
      - name: Clean up keychain (macOS only)
        if: matrix.platform == 'mac' && always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## yeorot MCP 설치 프로그램

            아래에서 운영체제에 맞는 파일을 다운로드하세요.

            | OS | 파일 |
            |---|---|
            | macOS | `.dmg` |
            | Windows | `.exe` |
            | Linux | `.AppImage` |

            ### 설치 방법
            1. 파일 다운로드 후 실행
            2. API 키 입력
            3. 설치하기 클릭
            4. Claude Desktop 재시작
